# Trivy operator — container vulnerability + compliance scanning
operator:
  scanJobsConcurrentLimit: 3
  vulnerabilityScannerEnabled: true
  sbomGenerationEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true
  clusterComplianceEnabled: true

trivy:
  severity: CRITICAL,HIGH
  ignoreUnfixed: true
  # Route through Harbor proxy cache instead of mirror.gcr.io
  # (mirror.gcr.io is unreachable from cluster pods)
  dbRepository: harbor.example.com/ghcr.io/aquasecurity/trivy-db
  javaDbRepository: harbor.example.com/ghcr.io/aquasecurity/trivy-java-db
  repository: harbor.example.com/ghcr.io/aquasecurity/trivy
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

excludeNamespaces: "kube-system"

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi
