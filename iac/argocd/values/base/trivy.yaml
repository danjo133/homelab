# Trivy operator — container vulnerability + compliance scanning
image:
  registry: harbor.example.com
  repository: ghcr.io/aquasecurity/trivy-operator

operator:
  scanJobsConcurrentLimit: 3
  vulnerabilityScannerEnabled: true
  sbomGenerationEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: true
  clusterComplianceEnabled: true

trivy:
  severity: CRITICAL,HIGH
  ignoreUnfixed: true
  # Route through Harbor proxy cache instead of mirror.gcr.io
  # (mirror.gcr.io is unreachable from cluster pods)
  image:
    registry: harbor.example.com
    repository: ghcr.io/aquasecurity/trivy
  dbRegistry: harbor.example.com
  dbRepository: ghcr.io/aquasecurity/trivy-db
  javaDbRegistry: harbor.example.com
  javaDbRepository: ghcr.io/aquasecurity/trivy-java-db
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

excludeNamespaces: "kube-system"

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi
